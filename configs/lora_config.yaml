# LoRA fine-tuning configuration. Every run is reproducible from this file alone.
base_model: meta-llama/Meta-Llama-3-8B
task: legal_clause_classification   # narrow, measurable domain

lora:
  r: 16                # rank — start at 16 (sweep 8/16/32)
  alpha: 32            # 2x rank, standard heuristic
  dropout: 0.05
  target_modules: [q_proj, v_proj]   # attention layers baseline
  bias: none

quantization:
  load_in_4bit: true   # QLoRA — fits an 8B model on a consumer GPU

training:
  learning_rate: 2.0e-4   # sweep 1e-4 / 2e-4 / 5e-4
  num_epochs: 3           # sweep 1 / 3 / 5
  per_device_batch_size: 4
  gradient_accumulation_steps: 4
  warmup_ratio: 0.03
  max_seq_length: 1024
  early_stopping_patience: 3
  save_steps: 50
  eval_steps: 50

tracking:
  project: lora-finetuning
  report_to: wandb        # or mlflow
